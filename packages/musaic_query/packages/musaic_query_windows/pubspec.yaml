name: musaic_query_windows
description: Local audio directory support for Windows.
publish_to: none
version: 3.0.7

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.4.1
  musaic_query_desktop:
    path: ../musaic_query_desktop
  musaic_query_platform_interface:
    path: ../musaic_query_platform_interface

flutter:
  plugin:
    implements: musaic_query
    platforms:
      windows:
        dartPluginClass: MusaicQueryWindows
