name: musaic_query_ios
publish_to: none
description: iOS implementation of the musaic_query plugin.
version: 1.1.0

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=2.5.0"

dependencies:
  # musaic_query
  musaic_query_platform_interface:
    path: ../musaic_query_platform_interface

  # Flutter
  flutter:
    sdk: flutter

dev_dependencies:
  # Flutter
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: musaic_query
    platforms:
      ios:
        pluginClass: MusaicQueryPlugin
