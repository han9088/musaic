name: musaic_query
publish_to: none
description: Flutter Plugin used to query audios/songs infos [title, artist, album, etc..] from device storage.
version: 3.0.7
topics:
  - audio
  - song
  - audioquery
  - on-audio-query
  - storage

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  # musaic_query
  musaic_query_platform_interface:
    path: ../musaic_query_platform_interface
  musaic_query_web:
    path: ../musaic_query_web
  musaic_query_ios:
    path: ../musaic_query_ios
  musaic_query_android:
    path: ../musaic_query_android

  # Flutter
  flutter:
    sdk: flutter

dev_dependencies:
  # Flutter
  flutter_lints: ^1.0.4
  flutter_test:
    sdk: flutter

# The following section is specific to Flutter.
flutter:
  # Material Design
  uses-material-design: true
  plugin:
    platforms:
      android:
        default_package: musaic_query_android
      ios:
        default_package: musaic_query_ios
      web:
        default_package: musaic_query_web
