name: musaic_query_macos
description: Read-only system Music library and local audio directory support for macOS.
publish_to: none
version: 3.0.7

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  musaic_query_desktop:
    path: ../musaic_query_desktop
  musaic_query_platform_interface:
    path: ../musaic_query_platform_interface

flutter:
  plugin:
    implements: musaic_query
    platforms:
      macos:
        dartPluginClass: MusaicQueryMacos
        pluginClass: MusaicQueryMacosPlugin
