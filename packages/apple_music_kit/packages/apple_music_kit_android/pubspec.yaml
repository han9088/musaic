name: apple_music_kit_android
description: Android implementation of apple_music_kit using Apple's MusicKit Android SDK.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

flutter:
  plugin:
    implements: apple_music_kit
    platforms:
      android:
        package: com.deskbtm.apple_music_kit
        pluginClass: AppleMusicKitPlugin
        dartPluginClass: AppleMusicKitAndroid
        fileName: apple_music_kit_android.dart

dependencies:
  apple_music_kit_platform_interface:
    path: ../apple_music_kit_platform_interface
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
