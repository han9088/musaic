<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Apple Music playback companion</title>
  <style>
    body { font: 18px/1.6 system-ui, sans-serif; max-width: 40rem; margin: 10vh auto; padding: 24px; color: #242424; background: #fafafa; }
    button { font: inherit; padding: 10px 20px; margin: 8px 8px 8px 0; cursor: pointer; }
    button:focus-visible { outline: 3px solid #9b174b; outline-offset: 3px; }
  </style>
</head>
<body>
  <h1>Apple Music playback</h1>
  <p>Keep this page open while listening. Control your music from the desktop app.</p>
  <p id="status" role="status" aria-live="polite">Connecting to the app…</p>
  <button id="authorize" disabled>Sign in to Apple Music</button>
  <button id="play" disabled>Play / Pause</button>
  <button id="stop" disabled>Stop playback</button>
  <p>If your browser blocks playback, press Play here once, then return to the app.</p>
  <script src="/companion.js"></script>
</body>
</html>
