name: musaic_audio_web
description: Web platform implementation of musaic_audio. This implementation is endorsed and therefore doesn't require a direct dependency.
homepage: https://github.com/ryanheise/just_audio/tree/master/just_audio_web
version: 0.4.16
publish_to: none

flutter:
  plugin:
    implements: musaic_audio
    platforms:
      web:
        pluginClass: MusaicAudioPlugin
        fileName: musaic_audio_web.dart

dependencies:
  musaic_audio_platform_interface:
    path: ../musaic_audio_platform_interface
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  synchronized: ^3.2.0

dev_dependencies:
  flutter_lints: ^2.0.1

environment:
  sdk: ^3.2.1
  flutter: '>=3.16.0'
