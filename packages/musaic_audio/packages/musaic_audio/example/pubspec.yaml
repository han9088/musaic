name: musaic_audio_example
description: Demonstrates how to use the musaic_audio plugin.
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.2.4
  rxdart: ^0.28.0
  musaic_audio:
    path: ../

dev_dependencies:
  # TODO: uncomment these dependencies when they have nullsafe versions.
  # flutter_driver:
  #   sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.16.4
  flutter_lints: ^2.0.1

flutter:
  # disable-swift-package-manager: true
  uses-material-design: true

  assets:
    - audio/
