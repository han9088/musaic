name: musaic_audio
description: A feature-rich audio player for Flutter. Loop, clip and sequence any sound from any source (asset/file/URL/stream) in gapless playlists.
version: 0.10.6
publish_to: none
repository: https://github.com/ryanheise/just_audio/tree/minor/just_audio
issue_tracker: https://github.com/ryanheise/just_audio/issues
topics:
  - audio
  - sound
  - player
  - background

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  musaic_audio_platform_interface:
    path: ../musaic_audio_platform_interface
  musaic_audio_web:
    path: ../musaic_audio_web
  audio_session: ">=0.1.24 <0.3.0"
  rxdart: '>=0.26.0 <0.29.0'
  path: ^1.8.0
  path_provider: ^2.0.0
  async: ^2.5.0
  uuid: '>=3.0.1 <5.0.0'
  crypto: ^3.0.0
  meta: ^1.3.0
  flutter:
    sdk: flutter
  synchronized: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.0.0
  plugin_platform_interface: ^2.0.0
  flutter_lints: ^2.0.1

flutter:
  plugin:
    platforms:
      android:
        package: com.deskbtm.musaic.audio
        pluginClass: MusaicAudioPlugin
      ios:
        pluginClass: MusaicAudioPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: MusaicAudioPlugin
        sharedDarwinSource: true
      web:
        default_package: musaic_audio_web
