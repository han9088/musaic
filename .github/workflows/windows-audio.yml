name: Windows x64 build and audio integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the pinned Windows x64 Flutter SDK
        id: flutter
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') {
            throw 'This job requires a Windows x64 runner.'
          }

          $version = ([regex]::Match((Get-Content -Raw mise.toml), '(?m)^flutter\s*=\s*"([^"]+)"\r?$')).Groups[1].Value
          if (-not $version) { throw 'Flutter version is missing from mise.toml.' }

          $releases = Invoke-RestMethod 'https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json'
          $release = $releases.releases | Where-Object {
            $_.version -eq $version -and $_.channel -eq 'stable' -and
            ($_.dart_sdk_arch -eq 'x64' -or -not $_.dart_sdk_arch)
          } | Select-Object -First 1
          if (-not $release.sha256) { throw "Windows x64 Flutter $version was not found." }

          $archive = Join-Path $env:RUNNER_TEMP 'flutter-windows-x64.zip'
          curl.exe --fail --location --retry 3 --silent --show-error "$($releases.base_url)/$($release.archive)" -o $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne $release.sha256) {
            throw 'Flutter SDK checksum mismatch.'
          }
          & 7z x -bd -y $archive "-o$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $env:RUNNER_TEMP 'flutter\bin') >> $env:GITHUB_PATH

      - name: Build the Musaic Windows x64 release
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = 'build/windows/x64/runner/Release'
          foreach ($file in @('musaic.exe', 'musaic_audio_windows_plugin.dll')) {
            if (-not (Test-Path (Join-Path $release $file))) {
              throw "Windows x64 release output is missing $file."
            }
          }

      - name: Set up Windows audio output
        id: audio
        if: ${{ !cancelled() && steps.flutter.outcome == 'success' }}
        run: |
          if (-not (Test-Path "$env:SystemRoot\System32\mfplat.dll")) {
            Install-WindowsFeature -Name Server-Media-Foundation
          }
          Get-Service -Name AudioEndpointBuilder, Audiosrv | ForEach-Object {
            if ($_.Status -ne 'Running') { Start-Service -Name $_.Name }
          }
          Get-Service -Name AudioEndpointBuilder, Audiosrv

          function Get-RenderDevices {
            Get-PnpDevice -Class AudioEndpoint -PresentOnly -ErrorAction SilentlyContinue |
              Where-Object { $_.Status -eq 'OK' -and $_.InstanceId -like 'SWD\MMDEVAPI\{0.0.0.*' }
          }
          function Get-VerifiedArchive($url, $file, $sha256) {
            curl.exe --fail --location --retry 3 --silent --show-error $url -o $file
            if ($LASTEXITCODE -ne 0) { throw "Download failed for $url." }
            if ((Get-FileHash -Algorithm SHA256 $file).Hash -ne $sha256) {
              throw "Checksum mismatch for $url."
            }
          }

          $devices = @(Get-RenderDevices)
          if ($devices.Count -eq 0) {
            # The hosted image has audio services but no audio hardware.
            $driverZip = Join-Path $env:RUNNER_TEMP 'vb-cable.zip'
            $driverDir = Join-Path $env:RUNNER_TEMP 'vb-cable'
            Get-VerifiedArchive 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack46.zip' $driverZip `
              'bc44e8974191a5a2427d6c979e2dab08dbb09925f3f435dfa2f0ba3e45b6eb90'
            Expand-Archive -LiteralPath $driverZip -DestinationPath $driverDir
            $signature = Get-AuthenticodeSignature (Join-Path $driverDir 'vbaudio_cable64_win10.cat')
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*CN=Microsoft Windows Hardware Compatibility Publisher*') {
              throw "VB-CABLE driver catalog has an unexpected signature: $($signature.Status)."
            }

            $wdk = Join-Path $env:RUNNER_TEMP 'wdk.nupkg'
            Get-VerifiedArchive 'https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/10.0.26100.6584/microsoft.windows.wdk.x64.10.0.26100.6584.nupkg' $wdk `
              'c393d03dfb640b5c92f546b32f6770ef68cd3aaf691956e7d66d8e2c28a1b55e'
            & 7z e $wdk 'devgen.exe' -r -bd -y "-o$driverDir"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $driverDir 'devgen.exe') /add /bus ROOT /hardwareid VBAudioVACWDM
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            pnputil.exe /add-driver (Join-Path $driverDir 'vbMmeCable64_win10.inf') /install
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }

            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              $devices = @(Get-RenderDevices)
              if ($devices.Count -gt 0) { break }
              Start-Sleep -Seconds 1
            } while ([DateTime]::UtcNow -lt $deadline)
          }
          if ($devices.Count -eq 0) { throw 'No active Windows playback endpoint was found.' }
          $devices | Select-Object FriendlyName, Status, InstanceId

      - name: Run native musaic_audio integration tests
        if: ${{ !cancelled() && steps.audio.outcome == 'success' }}
        working-directory: packages/musaic_audio/packages/musaic_audio/example
        run: flutter test integration_test/windows_playback_test.dart -d windows --reporter expanded
