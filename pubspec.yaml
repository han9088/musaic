name: musaic
description: Music, in Mosaic.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_cache_manager: ^3.4.8
  apple_music_kit:
    path: ../apple_music_kit/packages/apple_music_kit
  material_ui: 1.11.0
  signals_flutter: 7.1.0
  go_router: 18.1.4
  flex_color_scheme: 9.0.0
  talker_flutter: 5.2.0
  talker_dio_logger: 5.2.0
  google_fonts: 9.0.0
  phosphoricons_flutter: 1.1.1
  pulsar_haptics: 0.1.1
  audioplayers: 6.8.1
  sensors_plus: 7.1.1
  dynamic_app_icon_flutter_plus: 2.2.1
  sqflite: ^2.4.6
  shared_preferences: ^2.5.5
  musaic_query:
    path: packages/musaic_query/packages/musaic_query
  camera: ^0.12.2
  gal: ^3.0.1

dependency_overrides:
  audioplayers_android:
    path: packages/audioplayers_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7
  camera_platform_interface: ^2.15.1
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/sounds/
    - assets/albums/
    - assets/google_fonts/
    - assets/textures/dialog_noise.png
  shaders:
    - shaders/xerox.frag
