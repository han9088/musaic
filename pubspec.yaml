name: musaic
description: Music, in Mosaic.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_cache_manager: ^3.4.8
  http: ^1.6.0
  indiebase:
    git:
      url: https://github.com/han9088/indiebase3.git
      ref: bbae494458af9422d7eb23a06cf496c18e1b1b58
      path: sdks/dart
  package_info_plus: ^10.2.2
  pub_semver: ^2.2.1
  url_launcher: ^6.3.3
  apple_music_kit:
    path: ../apple_music_kit/packages/apple_music_kit
  material_ui: 1.11.0
  signals_flutter: 7.1.0
  go_router: 18.1.4
  flex_color_scheme: 9.0.0
  talker_flutter: 5.2.0
  talker_dio_logger: 5.2.0
  google_fonts: 9.0.0
  phosphoricons_flutter: 1.1.1
  hotkey_manager: ^0.3.0
  pulsar_haptics: 0.1.1
  audioplayers: 6.8.1
  sensors_plus: 7.1.1
  dynamic_app_icon_flutter_plus: 2.2.1
  sqflite: ^2.4.6
  shared_preferences: ^2.5.5
  musaic_query:
    path: packages/musaic_query/packages/musaic_query
  musaic_updater:
    path: packages/musaic_updater
  camera: ^0.12.2
  gal: ^3.0.1
  in_app_review: ^2.0.12
  share_plus: ^13.3.1
  file_picker: ^13.4.1
  flutter_email_sender: ^11.2.0
  device_info_plus: ^13.3.0
  wakelock_plus: ^1.8.2
  envied: ^1.3.10

dependency_overrides:
  audioplayers_android:
    path: packages/audioplayers_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7
  camera_platform_interface: ^2.15.1
  flutter_email_sender_method_channel: ^2.0.1
  shared_preferences_platform_interface: ^2.4.2
  envied_generator: ^1.3.10
  build_runner: ^2.16.2
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/sounds/
    - assets/albums/
    - assets/usage_guide/camera_sky.jpg
    - assets/google_fonts/
    - assets/textures/dialog_noise.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Italianno
      fonts:
        - asset: assets/google_fonts/Italianno-Regular.ttf
  shaders:
    - shaders/xerox.frag
    - shaders/gesture_guide_spotlight.frag
